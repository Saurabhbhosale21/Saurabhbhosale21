name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Generate all SVG cards
        run: |
          node << 'EOF'
          const fetch = require('node-fetch');
          const fs = require('fs');

          const USERNAME = 'Saurabhbhosale21';

          const cards = [
            {
              name: 'stats',
              urls: [
                `https://github-readme-stats-git-master-anuraghazras-projects.vercel.app/api?username=${USERNAME}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&icon_color=0078D4&text_color=C9D1D9&include_all_commits=true&count_private=true`,
                `https://github-readme-stats-anuraghazra1.vercel.app/api?username=${USERNAME}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&icon_color=0078D4&text_color=C9D1D9`,
                `https://readme.midnite.uk/api?username=${USERNAME}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&icon_color=0078D4&text_color=C9D1D9`
              ]
            },
            {
              name: 'top-langs',
              urls: [
                `https://github-readme-stats-git-master-anuraghazras-projects.vercel.app/api/top-langs/?username=${USERNAME}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&text_color=C9D1D9`,
                `https://github-readme-stats-anuraghazra1.vercel.app/api/top-langs/?username=${USERNAME}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&text_color=C9D1D9`,
                `https://readme.midnite.uk/api/top-langs/?username=${USERNAME}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&text_color=C9D1D9`
              ]
            },
            {
              name: 'streak',
              urls: [
                `https://github-readme-streak-stats.herokuapp.com?user=${USERNAME}&theme=tokyonight&hide_border=true&background=0D1117&stroke=0078D4&ring=0078D4&fire=FF6B35&currStreakLabel=0078D4&sideLabels=7EB3FF&dates=888888&currStreakNum=FFFFFF&sideNums=FFFFFF`,
                `https://streak-stats.demolab.com?user=${USERNAME}&theme=tokyonight&hide_border=true&background=0D1117&stroke=0078D4&ring=0078D4&fire=FF6B35&currStreakLabel=0078D4&sideLabels=7EB3FF&dates=888888`
              ]
            },
            {
              name: 'trophy',
              urls: [
                `https://github-profile-trophy.vercel.app/?username=${USERNAME}&theme=algolia&no-frame=false&no-bg=true&column=4&margin-w=15&margin-h=15`,
                `https://github-profile-trophy-xi-five.vercel.app/?username=${USERNAME}&theme=algolia&no-frame=false&no-bg=true&column=4&margin-w=15`
              ]
            },
            {
              name: 'repo-pin',
              urls: [
                `https://github-readme-stats-git-master-anuraghazras-projects.vercel.app/api/pin/?username=${USERNAME}&repo=dotnet-student-management-api&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&text_color=C9D1D9&icon_color=0078D4`,
                `https://github-readme-stats-anuraghazra1.vercel.app/api/pin/?username=${USERNAME}&repo=dotnet-student-management-api&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&text_color=C9D1D9&icon_color=0078D4`,
                `https://readme.midnite.uk/api/pin/?username=${USERNAME}&repo=dotnet-student-management-api&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&text_color=C9D1D9&icon_color=0078D4`
              ]
            }
          ];

          async function tryFetch(url, name) {
            try {
              console.log(`  [${name}] Trying: ${url.substring(0, 80)}...`);
              const res = await fetch(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'image/svg+xml,*/*'
                },
                timeout: 20000
              });
              console.log(`  [${name}] HTTP ${res.status}`);
              if (res.status !== 200) return null;
              const text = await res.text();
              if (text.includes('<svg')) {
                console.log(`  [${name}] ✅ Valid SVG (${text.length} chars)`);
                return text;
              }
              console.log(`  [${name}] ❌ Not SVG: ${text.substring(0, 100)}`);
              return null;
            } catch (err) {
              console.log(`  [${name}] Error: ${err.message}`);
              return null;
            }
          }

          async function main() {
            if (!fs.existsSync('generated')) fs.mkdirSync('generated');

            for (const card of cards) {
              console.log(`\n=== Fetching: ${card.name} ===`);
              let saved = false;
              for (const url of card.urls) {
                const svg = await tryFetch(url, card.name);
                if (svg) {
                  fs.writeFileSync(`generated/${card.name}.svg`, svg);
                  console.log(`✅ Saved generated/${card.name}.svg`);
                  saved = true;
                  break;
                }
                await new Promise(r => setTimeout(r, 5000));
              }
              if (!saved) {
                console.log(`❌ ALL URLs failed for ${card.name}`);
              }
            }

            console.log('\n=== FINAL RESULTS ===');
            fs.readdirSync('generated').forEach(f => {
              const c = fs.readFileSync(`generated/${f}`, 'utf8');
              console.log(`${c.includes('<svg') ? '✅' : '❌'} generated/${f} (${c.length} chars)`);
            });
          }

          main().catch(console.error);
          EOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add generated/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update github stats cards [skip ci]"
          git pull --rebase origin main
          git push origin main
