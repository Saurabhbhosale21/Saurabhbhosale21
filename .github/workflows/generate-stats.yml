name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch GitHub Stats Card SVG
        run: |
          mkdir -p generated
          curl -s "https://github-readme-stats.vercel.app/api?username=Saurabhbhosale21&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true&bg_color=0D1117&title_color=0078D4&icon_color=0078D4&text_color=C9D1D9" \
            -o generated/stats.svg
          echo "Stats card saved"

      - name: Fetch Top Languages Card SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Saurabhbhosale21&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&text_color=C9D1D9" \
            -o generated/top-langs.svg
          echo "Top langs card saved"

      - name: Fetch Streak Stats SVG
        run: |
          curl -s "https://github-readme-streak-stats.herokuapp.com?user=Saurabhbhosale21&theme=tokyonight&hide_border=true&background=0D1117&stroke=0078D4&ring=0078D4&fire=FF6B35&currStreakLabel=0078D4&sideLabels=7EB3FF&dates=888888&currStreakNum=FFFFFF&sideNums=FFFFFF" \
            -o generated/streak.svg
          echo "Streak card saved"

      - name: Fetch Trophy SVG
        run: |
          curl -s "https://github-profile-trophy.vercel.app/?username=Saurabhbhosale21&theme=algolia&no-frame=false&no-bg=true&column=4&margin-w=15&margin-h=15&rank=SECRET,SSS,SS,S,AAA,AA,A,B,C,UNKNOWN" \
            -o generated/trophy.svg
          echo "Trophy card saved"

      - name: Fetch Repo Pin SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/pin/?username=Saurabhbhosale21&repo=dotnet-student-management-api&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=0078D4&text_color=C9D1D9&icon_color=0078D4&show_owner=true" \
            -o generated/repo-pin.svg
          echo "Repo pin saved"

      - name: Commit and push generated SVGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add generated/
          git diff --staged --quiet || git commit -m "chore: update github stats cards [skip ci]"
          git push
